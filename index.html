<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông báo</title>
<style>
    body{
        margin:0;
        background:#111;
        color:#fff;
        font-family:Arial,sans-serif;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }
    .box{
        background:#222;
        padding:30px;
        border-radius:15px;
        text-align:center;
        max-width:500px;
        box-shadow:0 0 20px rgba(255,255,255,.15);
    }
    h1{color:#ff9800;}
    p{font-size:18px;line-height:1.6;}
    /* Kiểu dáng cho phần mã QR */
    .qr-section {
        margin: 25px 0;
        text-align: center;
    }
    .qr-section p {
        font-size: 16px;
        font-weight: bold;
        color: #4caf50; /* Màu xanh lá cây nổi bật */
        margin-bottom: 10px;
    }
    .qr-section img {
        width: 180px; /* Kích thước mã QR */
        height: 180px;
        border: 4px solid #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,255,0,.3);
    }
    button{
        margin-top:20px;
        padding:10px 25px;
        background:#ff9800;
        color:#fff;
        border:none;
        border-radius:8px;
        cursor:pointer;
    }
    button:hover{
        background:#e68900;
    }
</style>
</head>
<body>

<div class="box">
    <h1>📢 THÔNG BÁO ⏳</h1>
    <p>✨ HỆ THỐNG ĐANG NGƯNG HOẠT ĐỘNG ✨</p>

    <!-- PHẦN MÃ QR TỰ ĐỘNG TẠO BỞI GOOGLE VỚI LINK TELEGRAM CỦA BẠN -->
    <div class="qr-section">
        <p>Vui lòng quét mã QR để trò chuyện</p>
        <!-- Đường link đã được cập nhật chính xác đến nhóm Telegram của bạn -->
        <img src="https://chart.googleapis.com/chart?chs=180x180&cht=qr&chl=https://t.me/+w2z7pLeyrP8xYjQ9&choe=UTF-8" alt="Mã QR Telegram trò chuyện">
    </div>
    <!-- KẾT THÚC PHẦN MÃ QR -->

    <p>
        🎉 Người hạnh phúc không phải là người được sống trong hoàn cảnh thuận lợi, mà là một người có thái độ sống tốt trước bất kỳ hoàn cảnh nào 🎉
    </p>

    <button onclick="location.reload()">CẢM ƠN</button>
</div>

</body>
</html>
