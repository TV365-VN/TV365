<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông báo</title>
<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:#222;
    padding:30px;
    border-radius:15px;
    text-align:center;
    max-width:500px;
    box-shadow:0 0 20px rgba(255,255,255,.15);
}
h1{color:#ff9800;}
p{font-size:18px;line-height:1.6;}
button{
    margin-top:20px;
    padding:10px 25px;
    background:#ff9800;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#e68900;
}
</style>
</head>
<body>

<div class="box">
    <h1>📢 THÔNG BÁO</h1>
    <p>
        Hệ thống đang ngưng hoạt động.<br>
        <p>
        Người hạnh phúc không phải là người được sống trong hoàn cảnh thuận lợi, mà là một người có thái độ sống tốt trước bất kỳ hoàn cảnh nào.
    </p>

    <button onclick="location.reload()">CẢM ƠN</button>
</div>

</body>
</html>
